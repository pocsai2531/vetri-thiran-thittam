<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Comic Plan & Results - ComicCraft</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: #f8fafc;
      color: #1e293b;
      font-family: 'Outfit', sans-serif;
      margin: 0;
    }
    .result-container {
      max-width: 800px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }
    .card-plan {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #e0f2fe;
      color: #0369a1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">⚡ ComicCraft</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/docs" target="_blank">API Docs</a>
    </div>
  </nav>

  <div class="result-container">
    <div class="card-plan">
      <span class="badge">Architecture & Plan</span>
      <h2>AI Generation Pipeline Status</h2>
      <p style="color: #64748b; margin-top: 0.5rem;">
        ComicCraft harnesses Google Gemini 1.5 Flash for rapid 5-panel layout structuring,
        Gemini 1.5 Pro for rich dialogues, and Diffusers / Stable Diffusion for sequential comic panels.
      </p>
      
      <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <a href="/" class="btn-download" style="text-decoration:none;">Create a Comic Now</a>
        <a href="/test-image" class="btn-secondary" style="text-decoration:none;">Test Image Generator</a>
      </div>
    </div>
  </div>
</body>
</html>
