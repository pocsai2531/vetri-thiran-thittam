<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Exported Successfully - ComicCraft</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .success-wrapper {
      max-width: 600px;
      margin: 5rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }
    .success-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
    }
    .check-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: #dcfce7;
      color: #16a34a;
      font-size: 2.25rem;
      border-radius: 50%;
      margin-bottom: 1.5rem;
    }
    .success-heading {
      font-size: 1.65rem;
      font-weight: 800;
      color: #15803d;
      margin-bottom: 0.75rem;
    }
    .success-text {
      color: #64748b;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }
    .btn-create-another {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
    .btn-create-another:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .extra-actions {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .btn-link {
      color: #0284c7;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">⚡ ComicCraft</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/docs" target="_blank">API Docs</a>
    </div>
  </nav>

  <main class="success-wrapper">
    <div class="success-box">
      <div class="check-icon">✓</div>
      <h1 class="success-heading">Comic Exported Successfully!</h1>
      <p class="success-text">
        Your AI-powered comic has been successfully created! Dive back in and bring another story to life.
      </p>

      <div>
        <a href="/" class="btn-create-another">
          <span>🎨</span> Go Create Another Comic
        </a>
      </div>

      {% if pdf_path %}
      <div class="extra-actions">
        <a href="{{ pdf_path }}" target="_blank" class="btn-link">
          📄 View Downloaded PDF
        </a>
      </div>
      {% endif %}
    </div>
  </main>
</body>
</html>
